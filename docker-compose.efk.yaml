version: '3.8'

services:
  # --- СТЕК ЛОГИРОВАНИЯ ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.10
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  # --- ИНФРАСТРУКТУРА ---
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-multiple-databases.sql:/docker-entrypoint-initdb.d/init-multiple-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  # --- МИКРОСЕРВИСЫ ---
  billing-service:
    build: ./billing-service
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=billing_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  orders-service:
    build: ./orders-service
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=orders_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  notifications-service:
    build: ./notifications-service
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=notifications_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  # --- ШЛЮЗ (ИМИТАЦИЯ INGRESS НА ПОРТУ 8000) ---
  gateway:
    image: nginx:alpine
    ports:
      - "8000:8000"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat << 'EOF' > /etc/nginx/conf.d/default.conf
        server {
            listen 8000;
            location /api/v1/users { proxy_pass http://billing-service:8000; }
            location /api/v1/billing { proxy_pass http://billing-service:8000; }
            location /api/v1/orders { proxy_pass http://orders-service:8000; }
            location /api/v1/notifications { proxy_pass http://notifications-service:8000; }
        }
        EOF
        exec nginx -g 'daemon off;'
    depends_on:
      - billing-service
      - orders-service
      - notifications-service

volumes:
  pgdata:
